<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eat 'Em All - Multiplayer 2D Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Outfit', sans-serif;
            color: #f0f6fc;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #0d111a;
            cursor: crosshair;
        }

        /* Glassmorphic UI HUD */
        .hud-panel {
            position: absolute;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
        }

        /* Top Bar */
        #top-bar {
            top: 16px;
            left: 16px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .fps-badge {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .fps-val {
            color: #38ef7d;
            font-weight: 700;
        }

        /* Leaderboard */
        #leaderboard {
            top: 16px;
            right: 16px;
            width: 220px;
            padding: 14px;
        }
        #leaderboard h3 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #leaderboard ol {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #leaderboard li {
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
        }
        #leaderboard li.self {
            color: #38ef7d;
            font-weight: 700;
        }

        /* Bottom Player Stats */
        #player-stats {
            bottom: 20px;
            left: 20px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 240px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .stat-label { color: #94a3b8; }
        .stat-value { font-weight: 700; color: #f8fafc; }
        .health-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            border-radius: 4px;
            transition: width 0.2s ease;
        }

        /* Login Modal */
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            padding: 36px 30px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            z-index: 100;
        }
        #menu h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #menu p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        #user-name {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        #user-name:focus {
            border-color: #38ef7d;
            box-shadow: 0 0 12px rgba(56, 239, 125, 0.2);
        }
        #login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 10px;
            color: #0f172a;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 239, 125, 0.35);
        }
        #login-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>

        <div id="top-bar" class="hud-panel">
            <div class="logo">EAT 'EM ALL</div>
            <div class="fps-badge">FPS: <span id="current-fps" class="fps-val">60</span></div>
        </div>

        <div id="leaderboard" class="hud-panel">
            <h3>👑 Leaderboard</h3>
            <ol id="leaderboard-list">
                <li><span>1. Connecting...</span><span>-</span></li>
            </ol>
        </div>

        <div id="player-stats" class="hud-panel" style="display: none;">
            <div class="stats-row">
                <span class="stat-label">Player:</span>
                <span id="hud-name" class="stat-value">-</span>
            </div>
            <div class="stats-row">
                <span class="stat-label">Score:</span>
                <span id="hud-score" class="stat-value">0</span>
            </div>
            <div class="stats-row">
                <span class="stat-label">Mass / Radius:</span>
                <span id="hud-radius" class="stat-value">20</span>
            </div>
            <div class="health-track">
                <div id="hud-health" class="health-bar" style="width: 100%;"></div>
            </div>
        </div>

        <div id="menu">
            <h1>Hungry?</h1>
            <p>Enter your nickname to eat, grow, and conquer the arena!</p>
            <input type="text" id="user-name" placeholder="Enter nickname" maxlength="16" autofocus />
            <button type="button" id="login-btn">Start Eating</button>
        </div>
    </div>

    <script src="/Client/jquery.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/Client/client.js"></script>
</body>
</html>
